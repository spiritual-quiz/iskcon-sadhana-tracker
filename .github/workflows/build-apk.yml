name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild (Generate native Android folder)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          # Find generated release .apk file
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK file was not found!"
            exit 1
          fi
          echo "Found Release APK at: $APK_FILE"
          cp "$APK_FILE" build-output/Bhakti-Unnati.apk
          ls -la build-output/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bhakti-Unnati-Android-APK
          path: build-output/Bhakti-Unnati.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bhakti Unnati APK Build #${{ github.run_number }}
          body: |
            ## Bhakti Unnati — Advancement in Devotion
            ### Android APK Build #${{ github.run_number }}
            
            **Download Link**:
            Click **`Bhakti-Unnati.apk`** below to download the installable Android application directly to your phone.
            
            **Installation Instructions**:
            1. Download the `Bhakti-Unnati.apk` file on your Android device.
            2. Tap the downloaded file to install.
            3. If Android prompts *"Install unknown apps"*, tap **Settings** and allow installation.
          files: build-output/Bhakti-Unnati.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
